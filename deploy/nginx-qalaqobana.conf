# Qalaqobana — reverse proxy for Cloudflare → local app on :5017
# Install: sudo cp deploy/nginx-qalaqobana.conf /etc/nginx/sites-available/qalaqobana
#          sudo ln -sf /etc/nginx/sites-available/qalaqobana /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx

upstream qalaqobana_app {
    server 127.0.0.1:5017;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name qalaqobana.g1orga.dev;

    # Cloudflare → origin HTTP is fine with CF SSL mode "Flexible".
    # Prefer "Full (strict)" + Let's Encrypt; certbot will add the SSL server block.

    client_max_body_size 2M;

    location / {
        proxy_pass http://qalaqobana_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 86400;
    }

    # Socket.IO (polling + websocket)
    location /socket.io/ {
        proxy_pass http://qalaqobana_app/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_buffering off;
    }
}
