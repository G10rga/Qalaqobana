{% extends "base_live.html" %}
{% set page = "arena" %}
{% block title %}არენა — ქალაქობანა{% endblock %}
{% block content %}
<div class="flex flex-col gap-6 animate-fadeUp">
  <section class="relative overflow-hidden rounded-2xl bg-surface-container-low border border-surface-variant/40 p-6 sm:p-8 text-center shadow-xl">
    <div class="absolute inset-0 bg-gradient-to-b from-primary/5 to-transparent pointer-events-none"></div>
    <p id="arena-round" class="relative text-[10px] uppercase tracking-[0.2em] text-on-surface-variant font-bold mb-4">რაუნდი —</p>
    <div class="relative inline-flex flex-col items-center justify-center w-32 h-32 rounded-full bg-surface-container-highest shadow-[0_0_40px_rgba(255,200,128,0.2)] border border-primary/20">
      <span class="text-[10px] text-primary uppercase tracking-widest font-bold">ასო</span>
      <span id="arena-letter" class="text-6xl font-extrabold text-primary leading-none">—</span>
    </div>
    <p id="game-timer" class="relative mt-5 font-mono text-4xl sm:text-5xl text-tertiary font-extrabold tracking-tight">—:—</p>
  </section>

  <div id="stop-announcement-banner" class="hidden rounded-xl bg-error/15 border border-error/40 p-4 text-center animate-fadeUp">
    <h4 class="font-extrabold text-error text-lg">STOP!</h4>
  </div>

  <div class="grid lg:grid-cols-3 gap-5 sm:gap-6">
    <div id="answerForms" class="lg:col-span-2 flex flex-col gap-3"></div>
    <aside class="space-y-4 lg:sticky lg:top-24 self-start">
      <button type="button" id="btn-stop-buzzer"
        class="w-full py-7 rounded-2xl bg-gradient-to-b from-[#ff4d5a] to-[#a81423] text-white font-extrabold text-2xl sm:text-3xl shadow-[0_12px_40px_rgba(168,20,35,0.45)] hover:brightness-110 active:scale-[0.98] transition">
        სტოპ!
      </button>
      <p class="text-on-surface-variant text-sm text-center">ან <kbd class="px-1.5 py-0.5 rounded bg-surface-container font-mono text-xs">SPACE</kbd></p>
      <div class="bg-surface-container-low rounded-xl p-4 border border-surface-variant/30 space-y-2">
        <p class="text-[10px] uppercase tracking-wider text-on-surface-variant font-bold">ქულები</p>
        <div id="arena-scores" class="flex flex-col gap-1.5"></div>
      </div>
    </aside>
  </div>
</div>
{% endblock %}
