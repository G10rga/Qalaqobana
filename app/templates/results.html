{% extends "base_live.html" %}
{% set page = "results" %}
{% block title %}შედეგები — ქალაქობანა{% endblock %}
{% block content %}
<div class="flex flex-col gap-6 animate-fadeUp">
  <div class="text-center space-y-2">
    <p id="results-letter" class="text-5xl sm:text-6xl font-extrabold text-primary drop-shadow-[0_0_24px_rgba(255,200,128,0.25)]">—</p>
    <h1 id="results-title" class="text-xl sm:text-2xl font-extrabold">შედეგები</h1>
  </div>

  <div id="q-pending" class="rounded-2xl bg-surface-container-low border border-surface-variant/40 p-12 sm:p-16 text-center space-y-4 shadow-xl">
    <div class="mx-auto w-14 h-14 border-4 border-secondary/25 border-t-secondary rounded-full animate-spin"></div>
    <p class="font-extrabold text-xl">შედეგები მზადდება…</p>
    <p class="text-sm text-on-surface-variant">ვამოწმებთ პასუხებს</p>
  </div>

  <div id="results-body" class="hidden grid lg:grid-cols-3 gap-5 sm:gap-6">
    <div class="lg:col-span-2 overflow-x-auto rounded-2xl bg-surface-container-low border border-surface-variant/30 p-3 sm:p-4">
      <table class="w-full text-sm" id="results-table">
        <thead></thead>
        <tbody></tbody>
      </table>
    </div>
    <aside class="space-y-3">
      <h2 class="font-bold flex items-center gap-2">
        <span class="material-symbols-outlined text-primary text-[20px]">leaderboard</span>
        რაუნდის ქულები
      </h2>
      <div id="results-sidebar" class="flex flex-col gap-2"></div>
      <button type="button" id="nextRoundBtn"
        class="w-full py-3.5 rounded-xl bg-gradient-to-r from-primary-container to-primary text-on-primary-container font-extrabold shadow-[0_8px_24px_rgba(245,166,35,0.3)] hover:scale-[1.01] active:scale-[0.99] transition mt-2">
        შემდეგი რაუნდი
      </button>
    </aside>
  </div>

  <div class="flex flex-wrap justify-center gap-3 text-[11px] text-on-surface-variant pt-2">
    <span class="px-2.5 py-1 rounded-full bg-secondary/10 text-secondary font-bold">15 · მხოლოდ შენ</span>
    <span class="px-2.5 py-1 rounded-full bg-primary/10 text-primary font-bold">10 · უნიკალური</span>
    <span class="px-2.5 py-1 rounded-full bg-surface-container font-bold">5 · იგივე</span>
    <span class="px-2.5 py-1 rounded-full bg-error/10 text-error font-bold">0 · არასწორი</span>
  </div>
</div>
{% endblock %}
