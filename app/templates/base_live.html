<!DOCTYPE html>
<html class="dark" lang="ka">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}ქალაქობანა{% endblock %}</title>
  <link href="https://fonts.googleapis.com" rel="preconnect"/>
  <link crossorigin href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {darkMode:"class", theme:{extend:{
      colors:{
        background:"#061423", "on-surface":"#d6e4f9", "on-surface-variant":"#d7c3ae",
        primary:"#ffc880", "primary-container":"#f5a623", "on-primary-container":"#644000", "on-primary":"#452b00",
        secondary:"#48f1e5", "secondary-container":"#03d4c8", "on-secondary":"#003733", "on-secondary-container":"#005751",
        "surface-container":"#132030", "surface-container-low":"#0f1c2c", "surface-container-high":"#1e2b3b",
        "surface-container-highest":"#283646", "surface-container-lowest":"#020f1e", "surface-variant":"#283646",
        "surface-bright":"#2d3a4a",
        error:"#ffb4ab", tertiary:"#ffc3c1", outline:"#9f8e7a"
      },
      fontFamily:{sans:["Plus Jakarta Sans","sans-serif"]},
      keyframes:{
        float:{'0%,100%':{transform:'translateY(0)'},'50%':{transform:'translateY(-8px)'}},
        fadeUp:{'0%':{opacity:'0',transform:'translateY(12px)'},'100%':{opacity:'1',transform:'translateY(0)'}},
        pulseSoft:{'0%,100%':{opacity:'.45'},'50%':{opacity:'.9'}}
      },
      animation:{
        float:'float 6s ease-in-out infinite',
        fadeUp:'fadeUp .55s ease-out both',
        pulseSoft:'pulseSoft 2.8s ease-in-out infinite'
      }
    }}}
  </script>
  <style>
    body{font-family:"Plus Jakarta Sans",sans-serif}
    ::-webkit-scrollbar{display:none}
    .material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 500,'GRAD' 0,'opsz' 24}
    .letter-wash{user-select:none;pointer-events:none}
  </style>
  {% block head %}{% endblock %}
</head>
<body class="bg-background text-on-surface antialiased min-h-screen relative overflow-x-hidden selection:bg-secondary selection:text-on-secondary" data-page="{{ page|default('') }}">
  <div class="pointer-events-none fixed inset-0 z-0 overflow-hidden" aria-hidden="true">
    <div class="absolute -top-40 left-1/2 -translate-x-1/2 w-[720px] h-[380px] bg-secondary/10 rounded-full blur-[140px]"></div>
    <div class="absolute top-1/3 -right-28 w-[420px] h-[420px] bg-primary/10 rounded-full blur-[150px]"></div>
    <div class="absolute -bottom-28 -left-20 w-[480px] h-[480px] bg-secondary-container/10 rounded-full blur-[140px]"></div>
  </div>

  <header class="sticky top-0 z-50 bg-surface-container-lowest/80 backdrop-blur-xl border-b border-surface-variant/30 shadow-[0_4px_24px_rgba(0,0,0,0.35)]">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-3">
      <a href="/" class="flex items-center gap-2.5 group">
        <span class="w-9 h-9 rounded-xl bg-gradient-to-br from-primary-container to-primary text-on-primary-container flex items-center justify-center font-extrabold text-lg shadow-[0_0_20px_rgba(245,166,35,0.35)] group-hover:scale-105 transition">ქ</span>
        <div class="leading-none">
          <div class="font-extrabold text-primary tracking-wide text-base">ქალაქობანა</div>
          <div class="text-[10px] uppercase tracking-[0.18em] text-secondary/80 font-bold">Live</div>
        </div>
      </a>
      <div class="flex items-center gap-3 text-sm">
        <span id="header-room-code" class="hidden font-mono tracking-widest text-secondary bg-surface-container px-3 py-1 rounded-lg text-xs font-bold"></span>
        <span id="header-score" class="hidden text-on-surface-variant text-xs font-semibold"></span>
        <button type="button" id="leave-btn" class="hidden text-on-surface-variant hover:text-on-surface text-sm font-semibold px-2 py-1 rounded-lg hover:bg-surface-container transition">გასვლა</button>
      </div>
    </div>
  </header>

  <main class="relative z-10 max-w-5xl mx-auto px-4 sm:px-6 py-8 sm:py-10">
    {% block content %}{% endblock %}
  </main>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js" crossorigin="anonymous"></script>
  <script src="{{ url_for('static', filename='js/client.js') }}"></script>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
