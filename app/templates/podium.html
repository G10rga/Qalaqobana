{% extends "base_live.html" %}
{% set page = "podium" %}
{% block title %}ფინალი — ქალაქობანა{% endblock %}
{% block content %}
<div class="flex flex-col gap-8 animate-fadeUp">
  <div class="text-center space-y-2 relative">
    <div class="absolute left-1/2 -translate-x-1/2 -top-6 w-64 h-64 bg-primary/10 rounded-full blur-[80px] pointer-events-none"></div>
    <h1 class="relative text-3xl sm:text-4xl font-extrabold text-primary">მატჩი დასრულდა</h1>
    <p id="podium-subtitle" class="relative text-on-surface-variant text-sm"></p>
  </div>

  <div id="podium-top" class="flex flex-col sm:flex-row items-end justify-center gap-3 min-h-[160px]"></div>

  <section class="space-y-3">
    <h2 class="font-bold text-lg">სრული რეიტინგი</h2>
    <div id="podium-standings" class="flex flex-col gap-2"></div>
  </section>

  <div class="flex flex-col sm:flex-row gap-3">
    <button type="button" id="btn-replay"
      class="flex-1 py-4 rounded-xl bg-gradient-to-r from-primary-container to-primary text-on-primary-container font-extrabold shadow-[0_8px_28px_rgba(245,166,35,0.3)] hover:scale-[1.01] active:scale-[0.99] transition">
      ახალი მატჩი
    </button>
    <a href="/" data-path="lobbies"
      class="flex-1 py-4 rounded-xl bg-surface-container-high text-center font-bold text-on-surface border border-surface-variant/40 hover:bg-surface-container transition">
      გასვლა
    </a>
  </div>
</div>
{% endblock %}
